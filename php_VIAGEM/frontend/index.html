<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>test_parcels_Jicin</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

	<style>
		html,
		body {
			margin: 0;
			height: 100%;
		}

		#map {
			width: 100%;
			height: 100%;
		}

		#info {
			position: absolute;
			top: 20px;
			right: 20px;
			z-index: 1000;
			background: rgb(245, 242, 242);
			padding: 20px;
			width: 300px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
			border: 2px solid black;
			border-radius: 8px;
		}

		path:focus, 
        g:focus {
            outline: none;
        }
	</style>
</head>

<body>

	<div id="map"></div>

	<div id="info">
		Click a parcel for info
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<script>
		const map = L.map('map').setView([50.43520784966147, 15.368800382294596], 17);

		L.tileLayer(
			'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
			{
				attribution: '&copy; OpenStreetMap contributors'
			}
		).addTo(map);

		let selectedLayer = null;
		let selectedOwner = false;


		async function loadParcels() {
			try {
				const response = await fetch('api.php?action=parcels');

				if (!response.ok) {
					throw new Error('HTTP error ' + response.status);
				}

				const geojson = await response.json();

				console.log('Parcels received:', geojson);

				const parcelsLayer = L.geoJSON(geojson, {
					style: {
						color: 'red',
						weight: 1,
						fillColor: 'transparent',
						fillOpacity: 0.5,
					},

					onEachFeature: function (feature, layer) {
						layer.bindTooltip(
							'Parcel ' + feature.properties.label
						);

						layer.on('click', function () {
							const parcelId = feature.properties.gml_id || feature.properties.id;

							if (selectedLayer) {
								parcelsLayer.resetStyle(selectedLayer);
							}

							selectedLayer = layer;

							layer.setStyle({
								color: 'black',
								fillColor: 'gray',
								fillOpacity: 0.5
							});
							loadParcel(parcelId);
						});
					}
				}).addTo(map);


			} catch (error) {
				console.error('Could not load parcels:', error);

				document.getElementById('info').innerHTML =
					'<b>Error loading parcels:</b><br>' + error.message;
			}
		}

		async function loadParcel(id) {

			const response = await fetch(
				'api.php?action=parcel&id=' + encodeURIComponent(id)
			);

			const parcel = await response.json();
			selectedOwner = false;

			document.getElementById('info').innerHTML = `
				<h3>Parcelní číslo: ${parcel.parcelNumber}</h3>
				<p>Výměra: ${parcel.area} m²</p>
				<p>Druh pozemku: ${parcel.landType}</p>
				<p>Katastrální území: ${parcel.cadastralArea}</p>
				<button onclick="loadOwner('${parcel.ownerId}')">
					Ukázat majitele
				</button>
			`;
		}

		async function loadOwner(id) {
			const response = await fetch(
				'api.php?action=owner&id=' + encodeURIComponent(id)
			);

			const owner = await response.json();
			if (!selectedOwner) {
				document.getElementById('info').innerHTML += `
					<h3>Majitel</h3>
					<p>${owner.name}</p>
					<p>${owner.address}</p>
				`;
				selectedOwner = true;
			}
			
		}
		loadParcels();
	</script>

</body>

</html>
